<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>X annotation zoom repro (#557)</title>
</head>
<body>
  <p>
    Datetime line chart with an X range annotation from 00:00 to 12:00.
    Query: <code>?x=num</code> (epoch ms on a datetime axis, default),
    <code>?x=iso</code> (ISO strings, as a .NET DateTime serializes, with no xaxis.type) or
    <code>?x=isodt</code> (ISO strings on a datetime axis).
  </p>
  <div id="chart" style="width: 900px"></div>
  <script type="module">
    import VendoredApexCharts from '../../../../src/Blazor-ApexCharts/wwwroot/js/apexcharts.esm.js';

    // ?lib=<url of a UMD build> compares another apexcharts.js build with the vendored one.
    const params = new URLSearchParams(location.search);
    const lib = params.get('lib');
    if (lib) {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = lib;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    const ApexCharts = lib ? window.ApexCharts : VendoredApexCharts;
    const mode = params.get('x') || 'num';
    const day = Date.UTC(2024, 11, 19);
    const hour = 3600 * 1000;
    const toX = (ms) => mode === 'num' ? ms : new Date(ms).toISOString().replace('.000Z', '');

    const data = [];
    for (let t = day; t < day + 24 * hour; t += 10 * 60 * 1000) {
      data.push({ x: toX(t), y: Math.round(50 + 40 * Math.sin(t / hour)) });
    }

    const options = {
      chart: { type: 'line', height: 400, animations: { enabled: false } },
      series: [{ name: 'Net Profit', data }],
      // 'iso' leaves xaxis.type unset, as the reporter's Blazor page did.
      xaxis: mode === 'iso' ? {} : { type: 'datetime' },
      annotations: {
        xaxis: [
          { x: toX(day), x2: toX(day + 12 * hour), fillColor: '#fcba03' },
          { x: toX(day + 13 * hour), x2: toX(day + 20 * hour), fillColor: '#32a852' }
        ]
      }
    };

    // Zoom to [fromHour, toHour]. A category axis zooms by 1-based point index.
    window.zoomHours = (a, b) => mode === 'iso'
      ? window.chart.zoomX(a * 6 + 1, b * 6 + 1)
      : window.chart.zoomX(day + a * hour, day + b * hour);
    window.chart = new ApexCharts(document.querySelector('#chart'), options);
    window.chart.render().then(() => { window.ready = true; });
  </script>
</body>
</html>
